<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cinema HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth-page">
<nav class="navbar navbar-expand-lg navbar-dark cinema-navbar py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="https://via.placeholder.com/48x48.png?text=NC" alt="Cinema Logo">
            <span>NATIONAL CINEMA CENTER</span>
        </a>
    </div>
</nav>
<main class="auth-container">
    <div class="form-card text-center">
        <h2>Khu vực Admin</h2>
        <p class="text-muted">Từ đây bạn có thể quản lý suất chiếu, phòng chiếu, người dùng và nội dung.</p>
        <a href="/" class="btn btn-outline-light mt-3">Quay về trang chủ</a>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
