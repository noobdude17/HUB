<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Cinema HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth-page">

<nav class="navbar navbar-expand-lg navbar-dark cinema-navbar py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="https://via.placeholder.com/48x48.png?text=NC" alt="Cinema Logo">
            <span>NATIONAL CINEMA CENTER</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cinemaNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="cinemaNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Lịch chiếu</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Khuyến mãi</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Giá vé</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Giới thiệu</a></li>
            </ul>
            <div class="auth-buttons d-flex align-items-center">
                <a class="btn btn-outline-light" href="/register">Đăng ký</a>
                <a class="btn btn-danger" href="/login">Đăng nhập</a>
            </div>
        </div>
    </div>
</nav>

<main class="auth-container">
    <div class="form-card">
        <h2>Tạo tài khoản</h2>
        <form id="registerForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="registerFullName" placeholder="Họ và tên" required>
                <label for="registerFullName">Họ và tên</label>
            </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="registerEmail" placeholder="name@example.com" required>
                <label for="registerEmail">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input type="tel" class="form-control" id="registerPhone" placeholder="Số điện thoại">
                <label for="registerPhone">Số điện thoại</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="registerPassword" placeholder="Mật khẩu" required>
                <label for="registerPassword">Mật khẩu</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="registerConfirmPassword" placeholder="Nhập lại mật khẩu" required>
                <label for="registerConfirmPassword">Nhập lại mật khẩu</label>
            </div>
            <button type="submit" class="btn btn-danger w-100">Đăng ký</button>
        </form>
        <div id="registerMessage" class="form-alert mt-3"></div>
        <p class="mt-4 text-center text-muted">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/auth.js}"></script>
</body>
</html>
